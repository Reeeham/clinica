services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinica
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=clinica;Username=postgres;Password=postgres"
      Jwt__Secret: "${JWT_SECRET:-clinica-dev-secret-key-min-32-chars!!}"
      Jwt__Issuer: "clinica"
      Jwt__Audience: "clinica-client"
      Cors__AllowedOrigins__0: "http://localhost:3000"
      ASPNETCORE_ENVIRONMENT: "Production"
    ports:
      - "5100:8080"

volumes:
  pgdata:
