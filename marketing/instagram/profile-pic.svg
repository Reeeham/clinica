<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A2F5F"/>
      <stop offset="1" stop-color="#5A1F44"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6C290"/>
      <stop offset="1" stop-color="#D4A574"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>
  </defs>

  <!-- Rounded square background (Instagram crop safe) -->
  <rect width="320" height="320" rx="64" fill="url(#bg)"/>

  <!-- Subtle decorative arc -->
  <circle cx="260" cy="60" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="60" cy="270" r="90" fill="#000000" opacity="0.06"/>

  <!-- Monogram "C" -->
  <g filter="url(#soft)">
    <path d="M210 118 a62 62 0 1 0 0 84"
          fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
  </g>

  <!-- Accent dot (the "spark" of the brand) -->
  <circle cx="210" cy="160" r="13" fill="url(#gold)"/>

  <!-- Wordmark under monogram -->
  <text x="160" y="252" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
        font-size="34" font-weight="700" letter-spacing="2" fill="#ffffff">CLINICA</text>
</svg>
